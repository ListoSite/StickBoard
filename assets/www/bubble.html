<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:transparent;color:#EEF1F5;font-family:Roboto,system-ui,sans-serif;font-size:14px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hidden{display:none!important}
svg{display:block}

/* bolha */
#bub{position:fixed;left:4px;top:4px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;touch-action:none;
  background:radial-gradient(circle at 30% 25%,#5BEA94,#25D366 55%,#12A44A);box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
#bub.dim{background:radial-gradient(circle at 30% 25%,#4A525E,#2C323C 60%,#20252D)}
#bub svg{width:24px;height:24px;color:#06210F}
#bub.dim svg{color:#C9D1DC}
#bub .bd{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:#FF4D5E;color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid #0E1014}
#bub.pulse{animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55),0 6px 16px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 14px rgba(37,211,102,0),0 6px 16px rgba(0,0,0,.45)}}

/* painel */
#pan{position:fixed;inset:0;padding:2px}
.card{height:100%;border-radius:22px;background:linear-gradient(180deg,#171B22,#111419);border:1px solid #2A303A;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;animation:up .2s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.hd{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 12px;flex:none}
.logo{width:30px;height:30px;border-radius:10px;background:#25D366;display:grid;place-items:center;flex:none}
.logo svg{width:17px;height:17px;color:#06210F}
.tt{flex:1;min-width:0}
.tt .a{font-size:11px;color:#6B7482;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tt .b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600;color:#EEF1F5;margin-top:1px}
.tt .b.muted{color:#6B7482;font-weight:400}
.ib{width:36px;height:36px;border-radius:12px;background:#20252E;display:grid;place-items:center;flex:none}
.ib:active{background:#2C333E}
.ib svg{width:19px;height:19px}
.tabs{display:flex;gap:6px;padding:2px 12px 8px;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:30px;padding:0 12px;border-radius:15px;background:#1D222A;color:#9AA3B0;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab.on{background:rgba(37,211,102,.16);color:#25D366}
.tab .n{font-size:11px;background:#25D366;color:#06210F;border-radius:8px;padding:0 6px;line-height:16px}
.strip{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-columns:76px;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 12px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.s{border-radius:16px;background:#1A1F27;display:grid;place-items:center;position:relative;transition:transform .12s}
.s:active{transform:scale(.92);background:#20302A}
.s img{position:absolute;left:7%;top:7%;width:86%;height:86%;object-fit:contain;pointer-events:none}
.s .fv{position:absolute;top:3px;right:5px;font-size:11px}
.sep{grid-row:1/-1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;width:44px;color:#6B7482;font-size:10.5px;font-weight:700;text-align:center;line-height:1.2}
.sep .i{font-size:18px}
.empty{grid-row:1/-1;width:calc(100vw - 30px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9AA3B0;font-size:13px;text-align:center;padding:0 16px;line-height:1.4}
.empty .i{font-size:28px}
.empty b{color:#EEF1F5}
.s.sp{background:#1E2430}
.s.sp img{left:14%;top:6%;width:72%;height:calc(94% - 18px)}
.s .spi{position:absolute;top:3px;left:5px;font-size:12px}
.s .spn{position:absolute;left:3px;right:3px;bottom:3px;font-size:10px;font-weight:700;color:#C9D1DC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.spbar{display:flex;align-items:center;gap:8px;margin:0 12px 8px;background:rgba(37,211,102,.12);color:#CFEFDC;border-radius:12px;padding:5px 5px 5px 10px;font-size:12.5px;flex:none}
.spbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spbar button{background:#2C323C;color:#fff;border-radius:9px;padding:5px 10px;font-size:12px;font-weight:700}
#bub .zap{position:absolute;bottom:-3px;left:-3px;width:20px;height:20px;border-radius:10px;background:#FFC83D;display:grid;place-items:center;font-size:11px;border:2px solid #0E1014}
.ib.a18b{color:#6B7482}
.ib.a18b.on{color:#FF6B78;background:rgba(255,77,94,.2)}
.t18{font-size:11px;font-weight:800;border:1.8px solid currentColor;border-radius:7px;padding:1px 4px}
body.adult .card{border-color:rgba(255,77,94,.55)}
body.adult #bub{box-shadow:0 0 0 2px #FF4D5E,0 6px 16px rgba(0,0,0,.45)}
.sending{position:absolute;inset:0;background:rgba(14,16,20,.82);display:grid;place-items:center;border-radius:22px;font-weight:700;font-size:15px;color:#25D366;animation:fade .15s}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div id="bub">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.6" fill="currentColor"/></svg>
  <span class="bd hidden" id="badge"></span>
  <span class="zap hidden" id="zap">⚡</span>
</div>
<div id="pan" class="hidden">
  <div class="card" id="card">
    <div class="hd">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.6" fill="currentColor"/></svg></div>
      <div class="tt"><div class="a" id="qa">Stickers para</div><div class="b" id="qb"></div></div>
      <button class="ib a18b" id="a18" title="Modo +18"><span class="t18">18+</span></button>
      <button class="ib" id="kb" title="Abrir o teclado de stickers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 15h10"/></svg></button>
      <button class="ib" id="x" title="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="spbar hidden" id="spbar"><span id="spt"></span><button id="spx">Cancelar</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="strip" id="strip"></div>
  </div>
</div>
<script src="match.js"></script>
<script>
'use strict';
const B = window.BB, M = window.Match;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EM = new Map();
const info = e => EM.get(M.stripVS(e));
let DATA = { packs: [] }, IDX = [], text = '', mode = 'bubble', lastLoad = 0, tab = 'sug', lastCount = 0;
const img = (p, f) => `f/${encodeURIComponent(p.id)}/${encodeURIComponent(f)}?v=${p.version || 0}`;

function load(force) {
  if (!force && Date.now() - lastLoad < 4000) return;
  lastLoad = Date.now();
  try { DATA = M.modeData(JSON.parse(B.getData())); } catch (e) {}
  document.body.classList.toggle('adult', !!DATA.adultMode);
  const ab = document.getElementById('a18'); if (ab) ab.classList.toggle('on', !!DATA.adultMode);
  IDX = M.buildIndex(DATA, info);
}
function shuffle(r) { for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function results() { const r = M.search(IDX, text, 40); return DATA.kbShuffle ? shuffle(r) : r; }
function timeWords() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return { label: 'Bom dia', icon: '☀️', q: 'bom dia manhã café' };
  if (h >= 12 && h < 19) return { label: 'Boa tarde', icon: '🌤️', q: 'boa tarde almoço' };
  return { label: 'Boa noite', icon: '🌙', q: 'boa noite dormir sono' };
}
function getRecent() { try { return JSON.parse(localStorage.getItem('kbRecent') || '[]'); } catch (e) { return []; } }
function pushRecent(p, f) { try { const r = getRecent().filter(x => !(x.p === p && x.f === f)); r.unshift({ p, f }); localStorage.setItem('kbRecent', JSON.stringify(r.slice(0, 40))); } catch (e) {} }
function find(pid, f) { const p = DATA.packs.find(q => q.id === pid); const s = p && p.stickers.find(q => q.f === f); return s ? { p, s } : null; }
const line = () => text.split('\n').pop().trim();

function drawBadge() {
  const n = line() ? M.search(IDX, text, 99).length : 0;
  const b = $('#badge'), bub = $('#bub');
  b.classList.toggle('hidden', !n);
  b.textContent = n > 9 ? '9+' : n;
  bub.classList.toggle('dim', !n);
  if (n > lastCount) { bub.classList.remove('pulse'); void bub.offsetWidth; bub.classList.add('pulse'); }
  lastCount = n;
}
function tile(p, s) {
  const d = document.createElement('button');
  d.className = 's';
  d.innerHTML = `<img loading="lazy" src="${img(p, s.f)}">${s.fav ? '<span class="fv">⭐</span>' : ''}`;
  d.onclick = () => {
    pushRecent(p.id, s.f);
    const w = M.queryTokens(text);
    const skipped = [];
    if (w.length && tab === 'sug') for (const r of lastRes) { if (r.p.id === p.id && r.s.f === s.f) break; skipped.push({ p: r.p.id, f: r.s.f }); if (skipped.length >= 3) break; }
    try { B.learn2(p.id, s.f, JSON.stringify(w), JSON.stringify(skipped)); } catch (e) { if (w.length) try { B.learn(p.id, s.f, JSON.stringify(w)); } catch (e2) {} }
    const ov = document.createElement('div'); ov.className = 'sending'; ov.textContent = 'A enviar…';
    $('#card').appendChild(ov);
    setTimeout(() => ov.remove(), 1200);
    B.send(p.id, s.f);
  };
  return d;
}
function sep(icon, label) { const d = document.createElement('div'); d.className = 'sep'; d.innerHTML = `<span class="i">${icon}</span>${esc(label)}`; return d; }
function empty(icon, html) { const d = document.createElement('div'); d.className = 'empty'; d.innerHTML = `<span class="i">${icon}</span><div>${html}</div>`; return d; }

function drawTabs(nSug) {
  const favs = DATA.packs.reduce((a, p) => a + p.stickers.filter(s => s.fav).length, 0);
  const T = [['sug', '✨ Sugestões', nSug], ['fav', '⭐ Favoritos', 0], ['rec', '🕘 Recentes', 0]];
  if ((DATA.specials || []).some(sp => sp.first && find(sp.first.p, sp.first.f))) T.push(['spc', '⚡ Especiais', 0]);
  if (!favs) T.splice(1, 1);
  if (tab === 'fav' && !favs) tab = 'sug';
  if (tab === 'spc' && !(DATA.specials || []).length) tab = 'sug';
  $('#tabs').innerHTML = T.map(([id, l, n]) => `<button class="tab ${tab === id ? 'on' : ''}" data-t="${id}">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; drawPanel(); });
}
function drawPanel() {
  const l = line();
  $('#qa').textContent = l ? 'Stickers para' : 'Escreve uma frase';
  const qb = $('#qb');
  qb.textContent = l ? `«${l.length > 34 ? '…' + l.slice(-32) : l}»` : (DATA.adultMode ? 'só stickers +18' : 'e os stickers aparecem aqui');
  if (DATA.adultMode) $('#qa').textContent = '🔞 ' + $('#qa').textContent;
  qb.classList.toggle("muted", !l);
  const res = l ? results() : [];
  drawTabs(res.length);
  const st = $('#strip');
  st.innerHTML = '';
  if (tab === 'sug') {
    lastRes = DATA.kbShuffle ? [] : res;
    if (res.length) res.forEach(r => st.appendChild(tile(r.p, r.s)));
    else {
      const tw = timeWords();
      const now = M.search(IDX, tw.q, 12);
      if (now.length) { st.appendChild(sep(tw.icon, tw.label)); now.forEach(r => st.appendChild(tile(r.p, r.s))); }
      const rec = getRecent().map(x => find(x.p, x.f)).filter(Boolean).slice(0, 20);
      if (rec.length) { st.appendChild(sep('🕘', 'Recentes')); rec.forEach(x => st.appendChild(tile(x.p, x.s))); }
      if (!now.length && !rec.length) st.appendChild(empty('💬', l ? `Nada para <b>«${esc(l.slice(-30))}»</b> ainda.<br>Dá palavras aos teus stickers no StickTag.` : 'Escreve na conversa e eu mostro os stickers que combinam.'));
    }
  } else if (tab === 'spc') {
    const SP_IC = { seq: '⏱️', reply: '💬', choice: '🔢', random: '🎲', quiz: '🧠', game: '🎮', nudge: '🔔', typing: '💭' };
    (DATA.specials || []).forEach(sp => {
      const x = sp.first && find(sp.first.p, sp.first.f);
      if (!x) return;
      const d = document.createElement('button');
      d.className = 's sp';
      d.innerHTML = `<img loading="lazy" src="${img(x.p, x.s.f)}"><span class="spi">${SP_IC[sp.type] || '⚡'}</span><span class="spn">${esc(sp.name)}</span>`;
      d.onclick = () => {
        pushRecent(x.p.id, x.s.f);
        const ov = document.createElement('div'); ov.className = 'sending'; ov.textContent = '⚡ ' + sp.name;
        $('#card').appendChild(ov);
        setTimeout(() => ov.remove(), 1200);
        B.sendSpecial(sp.id);
      };
      st.appendChild(d);
    });
  } else if (tab === 'fav') {
    DATA.packs.forEach(p => p.stickers.forEach(s => { if (s.fav) st.appendChild(tile(p, s)); }));
  } else {
    const rec = getRecent().map(x => find(x.p, x.f)).filter(Boolean);
    if (rec.length) rec.forEach(x => st.appendChild(tile(x.p, x.s)));
    else st.appendChild(empty('🕘', 'Os stickers que enviares aparecem aqui.'));
  }
  st.scrollLeft = 0;
}

// arrastar e tocar na bolha
let down = null, moved = 0;
const bub = $('#bub');
bub.addEventListener('pointerdown', e => { down = { x: e.screenX, y: e.screenY }; moved = 0; bub.setPointerCapture(e.pointerId); });
bub.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.screenX - down.x, dy = e.screenY - down.y;
  if (Math.abs(dx) + Math.abs(dy) < 2) return;
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 8) B.drag(dx, dy);
  down = { x: e.screenX, y: e.screenY };
});
bub.addEventListener('pointerup', () => {
  if (!down) return;
  down = null;
  if (moved <= 8) { load(true); tab = 'sug'; B.expand(true); }
  else B.dragEnd();
});
$('#x').onclick = () => B.expand(false);
$('#spx').onclick = () => B.cancelSpecial();
let SPS = null, lastRes = [];
$('#kb').onclick = () => B.openKeyboard();
$('#a18').onclick = () => {
  const on = !DATA.adultMode;
  try { B.setOption('adultMode', on); } catch (e) {}
  load(true); tab = 'sug'; drawPanel();
};

window.BubbleApp = {
  setMode(m) {
    mode = m;
    $('#bub').classList.toggle('hidden', m !== 'bubble');
    $('#pan').classList.toggle('hidden', m !== 'panel');
    if (m === 'panel') { const c = $('#card'); c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; drawPanel(); }
    else drawBadge();
  },
  onText(t) {
    text = t || '';
    load(false);
    if (mode === 'panel') drawPanel(); else drawBadge();
  },
  onSpecial(st) {
    SPS = st;
    $('#zap').classList.toggle('hidden', !st);
    $('#spbar').classList.toggle('hidden', !st);
    if (st) $('#spt').innerHTML = `⚡ <b>${esc(st.name)}</b> ${st.waiting ? 'à espera da resposta…' : 'a enviar…'}`;
  },
  onSendFailed(why) {
    B.expand(true);
    const st = $('#strip');
    st.innerHTML = '';
    st.appendChild(empty('⚠️', why === 'old' ? 'Enviar pela bolha precisa do Android 11 ou mais recente.<br>Usa o botão de mudar de teclado.' : 'Ativa primeiro o teclado <b>StickTag · Stickers</b><br>(no StickTag → separador Teclado).'));
  }
};

(async function () {
  try {
    const j = await (await fetch('emoji.json')).json();
    j.emojis.forEach(a => EM.set(M.stripVS(a[0]), { e: a[0], n: a[2], pt: a[3] ? a[3].split('|') : [] }));
  } catch (e) {}
  load(true);
  try { text = B.getText(); } catch (e) {}
  BubbleApp.setMode('bubble');
})();
</script>
</body>
</html>
