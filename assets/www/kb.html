<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="kb.css">
</head>
<body>
<div id="kb">
  <div class="bar">
    <div class="q" id="q"></div>
    <span class="mode hidden" id="mode" title="Esta app não aceita stickers do teclado: vai abrir a partilha">↗</span>
    <button class="ib" id="del" title="Apagar">⌫</button>
    <button class="ib" id="back" title="Voltar ao teu teclado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 15h10"/></svg>
    </button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="flash hidden" id="flash"></div>
</div>
<script src="match.js"></script>
<script src="kb.js"></script>
</body>
</html>
