<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="kb.css">
</head>
<body>
<div id="kb">
  <div class="bar">
    <div class="q" id="q"></div>
    <span class="mode hidden" id="mode" title="Esta app não aceita stickers do teclado: vai abrir a partilha">↗</span>
    <button class="ib" id="srch" title="Procurar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="ib" id="multi" title="Enviar vários"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="3"/><path d="M8 21h10a3 3 0 0 0 3-3V8"/><path d="m6.5 9.5 2 2 4-4"/></svg></button>
    <button class="ib" id="shuf" title="Ordem aleatória"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="ib a18b" id="adult" title="Modo +18"><span class="t18">18+</span></button>
    <button class="ib" id="del" title="Apagar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9-5 6M11 9l5 6"/></svg></button>
    <button class="ib" id="back" title="Voltar ao teu teclado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 15h10"/></svg>
    </button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="keys hidden" id="keys"></div>
  <button class="sendn hidden" id="sendn"></button>
  <div class="pv hidden" id="pv"></div>
  <div class="flash hidden" id="flash"></div>
</div>
<script src="match.js"></script>
<script src="kb.js"></script>
</body>
</html>
