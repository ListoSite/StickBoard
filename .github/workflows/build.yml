name: Compilar StickTag

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas Android
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q aapt apksigner dalvik-exchange android-sdk-platform-23 zipalign

      - name: Compilar o APK
        run: |
          set -o pipefail
          bash tools/build.sh 2>&1 | tee build.log

      - name: Publicar o APK nas Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)
          TAG="v$VER.${{ github.run_number }}"
          cp build/StickTag.apk StickTag.apk
          gh release create "$TAG" StickTag.apk --title "StickTag $TAG" --notes "Compilação automática do commit ${GITHUB_SHA::7}. Descarrega o StickTag.apk." --latest

      - name: Guardar o registo do erro (se falhar)
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          tail -n 300 build.log > ci-error.log || echo "sem build.log" > ci-error.log
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f ci-error.log
          git commit -m "erro da compilação ${{ github.run_number }}"
          git push -f origin ci-logs
